
<!DOCTYPE html>
<html>
<head>
    <title>Face</title>
    <style>
        .face {
            width: 300px;
            height: 300px;
            background-color: yellow;
            position: relative;
        }

        .eye1 {
            width: 40px;
            height: 40px;
            background-color: black;
            position: absolute;
            top: 60px;
            left: 60px;
        }

        .eye2 {
            width: 40px;
            height: 40px;
            background-color: black;
            position: absolute;
            top: 60px;
            right: 60px;
        }

        .mouth {
            width: 200px;
            height: 120px;
            background-color: black;
            position: absolute;
            top: 140px;
            left: 50px;
        }

        .teeth {
            width: 200px;
            height: 45px;
            background-color: white;
        }
    </style>
</head>
<body>

    <div class="face">
        <div class="eye1"></div>
        <div class="eye2"></div>
        <div class="mouth">
            <div class="teeth"></div>
        </div>
    </div>

</body>
</html>
